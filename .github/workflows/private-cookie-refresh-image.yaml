name: Build cookie refresh test image

on:
  push:
    branches:
      - fix/persistent-cookie-refresh

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/smexhy/hoyolab-auto:persistent-cookie-refresh
          cache-from: type=gha
          cache-to: type=gha,mode=max
