name: Test

on:
  push:
    paths:
      - "cookie-helper/**"
      - ".github/workflows/cookie-helper.yml"
  pull_request:
    paths:
      - "cookie-helper/**"
      - ".github/workflows/cookie-helper.yml"

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cookie-helper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
